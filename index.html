<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specter's Checklist</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">

        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M4 12l5 5L20 6"/>
                    </svg>
                    <span class="logo-text">Specter's Checklist</span>
                </div>
            </div>
            <div class="header-center">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" id="globalSearch" placeholder="Search items" aria-label="Search items">
                    <kbd class="search-kbd">Ctrl K</kbd>
                </div>
            </div>
            <div class="header-right">
                <button class="header-btn" id="statsBtn" title="Statistics" aria-label="Statistics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 20V10M12 20V4M6 20v-6"/>
                    </svg>
                </button>
                <button class="header-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7v6h6M3 13c0-4.97 4.03-9 9-9a9 9 0 016.36 2.64"/>
                    </svg>
                </button>
                <button class="header-btn" id="redoBtn" title="Redo (Ctrl+Y)" aria-label="Redo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 7v6h-6M21 13c0-4.97-4.03-9-9-9a9 9 0 00-6.36 2.64"/>
                    </svg>
                </button>
                <div class="header-divider"></div>
                <button class="header-btn" id="themeToggle" title="Light or dark (D)" aria-label="Switch theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
                <button class="header-btn" id="settingsBtn" title="Settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/>
                        <circle cx="15" cy="6" r="2.5"/>
                        <circle cx="9" cy="12" r="2.5"/>
                        <circle cx="17" cy="18" r="2.5"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="quick-add-container">
            <div class="quick-add-bar">
                <span class="quick-add-icon" aria-hidden="true">+</span>
                <input type="text" class="quick-add-input" id="quickAddInput" placeholder="Add an item and press Enter" aria-label="Add an item">
                <div class="quick-add-hints">
                    <span class="hint-tag">#tag</span>
                    <span class="hint-priority">!high</span>
                    <span class="hint-date">@tomorrow</span>
                </div>
            </div>
        </div>

        <main class="main-content">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>Sections</h3>
                    <button class="sidebar-add-btn" id="addSectionBtn" title="New section (S)" aria-label="New section">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </div>
                <nav class="section-nav" id="sectionNav"></nav>
                <div class="sidebar-footer">
                    <div class="overall-progress">
                        <div class="progress-ring-container">
                            <svg class="progress-ring" viewBox="0 0 36 36">
                                <circle class="progress-ring-bg" cx="18" cy="18" r="15.9"/>
                                <circle class="progress-ring-fill" cx="18" cy="18" r="15.9" id="overallProgressRing"/>
                            </svg>
                            <span class="progress-ring-text" id="overallProgressText">0%</span>
                        </div>
                        <div class="progress-info">
                            <span class="progress-label">All sections</span>
                            <span class="progress-detail" id="overallProgressDetail">0 of 0 completed</span>
                        </div>
                    </div>
                </div>
            </aside>

            <div class="content-area" id="contentArea">
                <div class="empty-state" id="emptyState">
                    <h2>No sections yet</h2>
                    <p>A section holds a list of items. Add one, then type items into the bar above.</p>
                    <button class="cta-button" id="createFirstSection">New section</button>
                </div>

                <div class="checklist-container" id="checklistContainer"></div>
            </div>
        </main>
    </div>

    <div class="context-menu" id="contextMenu">
        <div class="context-menu-content"></div>
    </div>

    <div class="command-palette-overlay" id="commandPaletteOverlay">
        <div class="command-palette">
            <div class="command-palette-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" class="command-palette-input" id="commandPaletteInput" placeholder="Type a command or search" aria-label="Command or search">
            </div>
            <div class="command-palette-results" id="commandPaletteResults"></div>
            <div class="command-palette-footer">
                <span><kbd>Up</kbd> <kbd>Down</kbd> move</span>
                <span><kbd>Enter</kbd> run</span>
                <span><kbd>Esc</kbd> close</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle"></h3>
                <button class="modal-close" id="modalClose" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <div class="stats-panel" id="statsPanel">
        <div class="stats-panel-header">
            <h3>Statistics</h3>
            <button class="stats-close" id="statsClose" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="stats-panel-content" id="statsPanelContent"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="date-picker-overlay" id="datePickerOverlay">
        <div class="date-picker" id="datePicker"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/features.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
