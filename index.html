<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specter's Checklist</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Ambient Background Effects -->
    <div class="ambient-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Main Application Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
                    </svg>
                    <span class="logo-text">Specter</span>
                </div>
            </div>
            <div class="header-center">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" id="globalSearch" placeholder="Search items... (Ctrl+F)">
                    <kbd class="search-kbd">⌘K</kbd>
                </div>
            </div>
            <div class="header-right">
                <button class="header-btn" id="statsBtn" title="Statistics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 20V10M12 20V4M6 20v-6"/>
                    </svg>
                </button>
                <button class="header-btn" id="undoBtn" title="Undo (Ctrl+Z)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7v6h6M3 13c0-4.97 4.03-9 9-9a9 9 0 016.36 2.64"/>
                    </svg>
                </button>
                <button class="header-btn" id="redoBtn" title="Redo (Ctrl+Y)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 7v6h-6M21 13c0-4.97-4.03-9-9-9a9 9 0 00-6.36 2.64"/>
                    </svg>
                </button>
                <div class="header-divider"></div>
                <button class="header-btn" id="themeToggle" title="Toggle Theme (D)">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
                <button class="header-btn" id="settingsBtn" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Quick Add Bar -->
        <div class="quick-add-container">
            <div class="quick-add-bar">
                <svg class="quick-add-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v8M8 12h8"/>
                </svg>
                <input type="text" class="quick-add-input" id="quickAddInput" placeholder="Add new item... (N) — Use #tag !priority @due">
                <div class="quick-add-hints">
                    <span class="hint-tag">#tag</span>
                    <span class="hint-priority">!high</span>
                    <span class="hint-date">@tomorrow</span>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Sidebar for Sections -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>Sections</h3>
                    <button class="sidebar-add-btn" id="addSectionBtn" title="Add Section (S)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </div>
                <nav class="section-nav" id="sectionNav">
                    <!-- Sections will be rendered here -->
                </nav>
                <div class="sidebar-footer">
                    <div class="overall-progress">
                        <div class="progress-ring-container">
                            <svg class="progress-ring" viewBox="0 0 36 36">
                                <circle class="progress-ring-bg" cx="18" cy="18" r="15.9"/>
                                <circle class="progress-ring-fill" cx="18" cy="18" r="15.9" id="overallProgressRing"/>
                            </svg>
                            <span class="progress-ring-text" id="overallProgressText">0%</span>
                        </div>
                        <div class="progress-info">
                            <span class="progress-label">Overall Progress</span>
                            <span class="progress-detail" id="overallProgressDetail">0 of 0 completed</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Checklist Content -->
            <div class="content-area" id="contentArea">
                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-illustration">
                        <svg viewBox="0 0 200 200" fill="none">
                            <circle cx="100" cy="100" r="80" stroke="currentColor" stroke-width="2" stroke-dasharray="8 4" opacity="0.3"/>
                            <rect x="60" y="60" width="80" height="100" rx="8" stroke="currentColor" stroke-width="2" opacity="0.5"/>
                            <path d="M75 90h50M75 110h35M75 130h45" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
                            <circle cx="68" cy="90" r="4" fill="currentColor" opacity="0.4"/>
                            <circle cx="68" cy="110" r="4" fill="currentColor" opacity="0.4"/>
                            <circle cx="68" cy="130" r="4" fill="currentColor" opacity="0.4"/>
                        </svg>
                    </div>
                    <h2>Your checklist awaits</h2>
                    <p>Create your first section to get started, or use the quick add bar above.</p>
                    <button class="cta-button" id="createFirstSection">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        Create First Section
                    </button>
                </div>

                <!-- Checklist Container (hidden when empty) -->
                <div class="checklist-container" id="checklistContainer">
                    <!-- Sections and items will be rendered here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-content">
            <!-- Menu items will be dynamically inserted -->
        </div>
    </div>

    <!-- Command Palette -->
    <div class="command-palette-overlay" id="commandPaletteOverlay">
        <div class="command-palette">
            <div class="command-palette-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" class="command-palette-input" id="commandPaletteInput" placeholder="Type a command or search...">
            </div>
            <div class="command-palette-results" id="commandPaletteResults">
                <!-- Results will be rendered here -->
            </div>
            <div class="command-palette-footer">
                <span><kbd>↑↓</kbd> Navigate</span>
                <span><kbd>Enter</kbd> Select</span>
                <span><kbd>Esc</kbd> Close</span>
            </div>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Modal Title</h3>
                <button class="modal-close" id="modalClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content will be inserted here -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Modal actions will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Statistics Panel -->
    <div class="stats-panel" id="statsPanel">
        <div class="stats-panel-header">
            <h3>Statistics</h3>
            <button class="stats-close" id="statsClose">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="stats-panel-content" id="statsPanelContent">
            <!-- Stats will be rendered here -->
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer">
        <!-- Toasts will be added here -->
    </div>

    <!-- Date Picker (Hidden by default) -->
    <div class="date-picker-overlay" id="datePickerOverlay">
        <div class="date-picker" id="datePicker">
            <!-- Date picker will be rendered here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/features.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
